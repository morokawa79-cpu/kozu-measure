<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob: pdfres:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: pdfres:; worker-src 'self' blob:; connect-src 'self' data: blob: pdfres:">
  <title>土地区画作成工房 v2.0.0-alpha.2</title>
  <link rel="stylesheet" href="jww-v200.css">
  <script src="vendor/pdf.min.js"></script>
</head>
<body>
  <svg class="icon-defs" aria-hidden="true" focusable="false">
    <symbol id="icon-underlay" viewBox="0 0 24 24"><path d="M4 3.5h12l4 4V20.5H4z"/><path d="M16 3.5v4h4M7 16l3-3 2.2 2.2 2.2-2.2 2.6 3M8 9.5h3"/></symbol>
    <symbol id="icon-calibrate" viewBox="0 0 24 24"><path d="M4 7v10M20 7v10M4 12h16M7 9l-3 3 3 3M17 9l3 3-3 3"/></symbol>
    <symbol id="icon-parcel" viewBox="0 0 24 24"><path d="M5 5l11-2 4 13-11 5-6-9z"/><circle cx="5" cy="5" r="1.4"/><circle cx="16" cy="3" r="1.4"/><circle cx="20" cy="16" r="1.4"/><circle cx="9" cy="21" r="1.4"/><circle cx="3" cy="12" r="1.4"/></symbol>
    <symbol id="icon-select" viewBox="0 0 24 24"><path d="M5 3l12 11-6 .7-3.2 5.1z"/><path d="M13.2 14.4l4.3 5"/></symbol>
    <symbol id="icon-vertex" viewBox="0 0 24 24"><path d="M5 6l13-2 2 13-12 3-5-9z"/><circle cx="18" cy="4" r="2.4"/><circle cx="8" cy="20" r="1.4"/></symbol>
    <symbol id="icon-text" viewBox="0 0 24 24"><path d="M4 5h16M12 5v15M8 20h8"/></symbol>
    <symbol id="icon-dimension" viewBox="0 0 24 24"><path d="M4 5v14M20 5v14M4 15h16M7 12l-3 3 3 3M17 12l3 3-3 3"/><path d="M9 8h6"/></symbol>
    <symbol id="icon-delete" viewBox="0 0 24 24"><path d="M7 7h10l-1 13H8zM5 7h14M9 4h6M10 10v7M14 10v7"/></symbol>
    <symbol id="icon-undo" viewBox="0 0 24 24"><path d="M9 7H4v-5M4 7c3-4 10-5 14-1 3.5 3.5 2.5 10-2 13"/></symbol>
    <symbol id="icon-redo" viewBox="0 0 24 24"><path d="M15 7h5v-5M20 7c-3-4-10-5-14-1-3.5 3.5-2.5 10 2 13"/></symbol>
    <symbol id="icon-save" viewBox="0 0 24 24"><path d="M4 3h13l3 3v15H4zM8 3v6h8V3M8 14h8v7H8z"/></symbol>
    <symbol id="icon-fit" viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/><path d="M8 8h8v8H8z"/></symbol>
    <symbol id="icon-actual" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16"/><path d="M9 9h2v7M9 16h4M15 9v7"/></symbol>
    <symbol id="icon-export" viewBox="0 0 24 24"><path d="M4 5h9v5h6v10H4z"/><path d="M13 3v7M10 6l3-3 3 3"/></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="M9 7H4v-5M4 7c3-4 10-5 14-1"/></symbol>
    <symbol id="icon-cancel" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></symbol>
    <symbol id="icon-open" viewBox="0 0 24 24"><path d="M3 7h7l2 2h9l-3 11H5zM5 7V4h6l2 3"/></symbol>
  </svg>
  <div id="app-shell">
    <header id="menu-bar" aria-label="メニューバー">
      <div id="menu-cluster">
        <div class="menu-root">
          <button class="menu-button" type="button" data-menu="file">ファイル(F)</button>
          <div class="menu-popup" data-popup="file" hidden>
            <button type="button" data-action="new">新規作成 <kbd>Ctrl+N</kbd></button>
            <button type="button" data-action="open-underlay">下絵を開く <kbd>Ctrl+O</kbd></button>
            <button type="button" data-action="open-project">作業ファイルを開く</button>
            <span class="menu-separator"></span>
            <button type="button" data-action="save-project">作業ファイルを保存 <kbd>Ctrl+S</kbd></button>
            <button type="button" data-action="export-png">画像に出力</button>
          </div>
        </div>
        <div class="menu-root">
          <button class="menu-button" type="button" data-menu="edit">編集(E)</button>
          <div class="menu-popup" data-popup="edit" hidden>
            <button type="button" data-action="undo">戻る <kbd>Ctrl+Z</kbd></button>
            <button type="button" data-action="redo">進む <kbd>Ctrl+Y</kbd></button>
            <span class="menu-separator"></span>
            <button type="button" data-command="select">選択</button>
            <button type="button" data-command="vertex">頂点編集</button>
            <button type="button" data-command="delete">消去</button>
          </div>
        </div>
        <div class="menu-root">
          <button class="menu-button" type="button" data-menu="view">表示(V)</button>
          <div class="menu-popup" data-popup="view" hidden>
            <button type="button" data-action="fit">全体表示 <kbd>F</kbd></button>
            <button type="button" data-action="actual-size">等倍表示</button>
            <button type="button" data-action="toggle-underlay">下絵 表示/非表示</button>
          </div>
        </div>
        <div class="menu-root">
          <button class="menu-button" type="button" data-menu="settings">設定(S)</button>
          <div class="menu-popup" data-popup="settings" hidden>
            <button type="button" data-command="calibrate">縮尺を合わせる</button>
            <button type="button" data-action="toggle-grid">補助グリッド 表示/非表示</button>
            <button type="button" data-action="reset-style">区画色を標準に戻す</button>
          </div>
        </div>
        <button class="menu-button" type="button" data-action="show-help">ヘルプ(H)</button>
      </div>
      <div id="document-strip">
        <span id="dirty-mark" aria-label="未保存" hidden>●</span>
        <span id="document-name">無題</span>
        <span class="version-label">v2.0.0-alpha.2</span>
      </div>
    </header>

    <section id="control-bar" aria-label="コントロールバー">
      <div id="command-name">下絵</div>
      <div id="command-controls"></div>
    </section>

    <main id="work-area">
      <aside id="draw-toolbar" class="tool-rail" aria-label="作図ツール">
        <div class="rail-caption">作図</div>
        <button type="button" data-command="underlay" class="active" title="下絵を開く・調整 (B)"><svg class="tool-icon"><use href="#icon-underlay"/></svg><span class="tool-label">下絵</span><kbd>B</kbd></button>
        <button type="button" data-command="calibrate" title="2点で縮尺を設定 (C)"><svg class="tool-icon"><use href="#icon-calibrate"/></svg><span class="tool-label">縮尺</span><kbd>C</kbd></button>
        <div class="rail-gap"></div>
        <button type="button" data-command="parcel" title="区画を描く (Q)"><svg class="tool-icon"><use href="#icon-parcel"/></svg><span class="tool-label">区画</span><kbd>Q</kbd></button>
        <button type="button" data-command="select" title="区画を選択 (V)"><svg class="tool-icon"><use href="#icon-select"/></svg><span class="tool-label">選択</span><kbd>V</kbd></button>
        <button type="button" data-command="vertex" title="頂点を編集 (E)"><svg class="tool-icon"><use href="#icon-vertex"/></svg><span class="tool-label">頂点</span><kbd>E</kbd></button>
        <button type="button" data-command="label" title="区画文字を調整 (T)"><svg class="tool-icon"><use href="#icon-text"/></svg><span class="tool-label">文字</span><kbd>T</kbd></button>
        <button type="button" data-command="dimension" title="区画寸法を調整 (M)"><svg class="tool-icon"><use href="#icon-dimension"/></svg><span class="tool-label">寸法</span><kbd>M</kbd></button>
        <button type="button" data-command="delete" title="区画を消去 (D)"><svg class="tool-icon"><use href="#icon-delete"/></svg><span class="tool-label">消去</span><kbd>D</kbd></button>
      </aside>

      <section id="drawing-stage" aria-label="作図領域">
        <canvas id="drawing-canvas" tabindex="0"></canvas>
        <div id="empty-guide">
          <div class="empty-title">公図・地図をここにドロップ</div>
          <div class="empty-sub">PDF / PNG / JPEG　または左の「下絵」</div>
          <button type="button" data-action="open-underlay">下絵を開く</button>
        </div>
      </section>

      <aside id="view-toolbar" class="tool-rail" aria-label="共通ツール">
        <div class="rail-caption">共通</div>
        <button type="button" data-action="undo" title="戻る (Ctrl+Z)"><svg class="tool-icon"><use href="#icon-undo"/></svg><span class="tool-label">戻る</span></button>
        <button type="button" data-action="redo" title="進む (Ctrl+Y)"><svg class="tool-icon"><use href="#icon-redo"/></svg><span class="tool-label">進む</span></button>
        <button type="button" data-action="save-project" title="保存 (Ctrl+S)"><svg class="tool-icon"><use href="#icon-save"/></svg><span class="tool-label">保存</span></button>
        <div class="rail-gap"></div>
        <button type="button" data-action="fit" title="全体表示 (F)"><svg class="tool-icon"><use href="#icon-fit"/></svg><span class="tool-label">全体</span><kbd>F</kbd></button>
        <button type="button" data-action="actual-size" title="100%表示"><svg class="tool-icon"><use href="#icon-actual"/></svg><span class="tool-label">100%</span></button>
        <div class="rail-gap"></div>
        <button type="button" data-action="export-png" title="画像に出力"><svg class="tool-icon"><use href="#icon-export"/></svg><span class="tool-label">出力</span></button>
      </aside>
    </main>

    <footer id="status-bar" aria-label="ステータスバー">
      <div id="status-message">下絵を開くか、作図領域へPDF・画像をドロップしてください</div>
      <div class="status-cell" id="status-coord">X 0.0　Y 0.0</div>
      <button class="status-cell status-button" id="status-scale" type="button" data-command="calibrate">縮尺 未設定</button>
      <div class="status-cell" id="status-zoom">100%</div>
      <div class="status-cell" id="status-count">区画 0</div>
    </footer>
  </div>

  <input id="underlay-input" type="file" accept="application/pdf,image/png,image/jpeg,image/webp" hidden>
  <input id="project-input" type="file" accept="application/json,.json" hidden>

  <div id="close-bar" role="alertdialog" aria-modal="false" hidden>
    <span>未保存の変更があります。</span>
    <button type="button" data-close-choice="cancel">作業に戻る</button>
    <button type="button" data-close-choice="discard">保存せず終了</button>
    <button type="button" data-close-choice="save" class="primary">保存して終了</button>
  </div>

  <script src="jww-v200.js"></script>
</body>
</html>
